services:
  - type: web
    name: rap-word-splitter
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEFAULT_MODEL
        value: base
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: JOB_TTL_HOURS
        value: "6"
      - key: MAX_PENDING_JOBS
        value: "2"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_PASSWORD
        sync: false
